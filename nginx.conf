# Rate limiting zone (HTTP context — this file is included via conf.d).
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    # ACME challenge for Let's Encrypt (HTTP-01) — uncomment the HTTPS server
    # below, place certs, and enable the 301 redirect when ready.
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        limit_req zone=general burst=10 nodelay;
        return 200 "ok\n";
    }

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # ---------- Security headers ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), browsing-topics=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.emailjs.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-XSS-Protection "0" always;

    # Deny access to dotfiles (e.g. .env, .git) but keep /.well-known/ alive.
    location ~ /\.(?!well-known) {
        deny all;
    }

    # Hashed build assets: cache forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback (single page, but keeps deep links working)
    location / {
        # This origin only serves GET/HEAD; nothing else is valid here.
        limit_except GET HEAD {
            deny all;
        }
        limit_req zone=general burst=25 nodelay;
        try_files $uri $uri/ /index.html;
    }

    # Uncomment to force HTTPS once certificates are configured:
    # return 301 https://$host$request_uri;
}

