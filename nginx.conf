# Rate limiting & connection limiting zones (HTTP context)
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    server_tokens off;

    # ---------- DoS & Slowloris Mitigation ----------
    # Tight client timeouts prevent connection starvation attacks
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Reject oversized payloads and oversized headers (static site only requires GET/HEAD)
    client_max_body_size 1k;
    client_body_buffer_size 1k;
    client_header_buffer_size 1k;
    large_client_header_buffers 2 2k;

    # Return standard HTTP 429 Too Many Requests when throttled
    limit_req_status 429;
    limit_conn_status 429;

    # Max 20 concurrent connections per IP to mitigate connection floods
    limit_conn addr_limit 20;

    # ACME challenge for Let's Encrypt (HTTP-01)
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        limit_req zone=general burst=10 nodelay;
        return 200 "ok\n";
    }

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Default security headers for server responses
    include /etc/nginx/security-headers.conf;

    # Block dotfiles and hidden folders (e.g. .env, .git) with 404 (prevents file enumeration)
    location ~ /\.(?!well-known) {
        return 404;
    }

    # Block common automated vulnerability scanner probes with 404
    location ~* (\.php|\.aspx|\.jsp|\.cgi|\.env|\.git|\.yml|\.yaml|\.sql|\.bak|\.config)$ {
        return 404;
    }

    # Hashed build assets: cache forever (immutable)
    # Re-includes security headers because Nginx child add_header overrides parent
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    # Main HTML document: ensure fresh fetch + full security headers
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # SPA fallback: only allow GET and HEAD methods
    location / {
        limit_except GET HEAD {
            deny all;
        }
        limit_req zone=general burst=25 nodelay;
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }

    # Uncomment to force HTTPS once certificates are configured:
    # return 301 https://$host$request_uri;
}

