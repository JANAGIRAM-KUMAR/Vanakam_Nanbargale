name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: https://janagiram.dpdns.org

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub's internal branch-based build ("pages build and deployment") is
      # triggered by the same push and publishes raw source if it finishes last.
      # Wait it out so OUR artifact is always the final deployment.
      - name: Wait for in-flight branch Pages builds to finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            pending=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?per_page=30" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and .status != "completed")] | length' 2>/dev/null || true)
            case "$pending" in
              ''|*[!0-9]*) pending=0 ;;
            esac
            if [ "$pending" = "0" ]; then
              echo "No branch Pages builds in flight."
              exit 0
            fi
            echo "Waiting on ${pending} branch Pages build(s) before deploying… (${i}/40)"
            sleep 10
          done
          echo "Timed out waiting for branch builds; deploying anyway."

      # Best effort: once the source is "GitHub Actions" the branch build is
      # never triggered again and this becomes a no-op.
      - name: Switch Pages build source to GitHub Actions (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow; then
            echo "Pages source set to GitHub Actions."
          else
            echo "::warning::Could not switch Pages source via API — set it manually: repo Settings → Pages → Source → GitHub Actions"
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
