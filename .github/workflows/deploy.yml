name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: https://janagiram.dpdns.org

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # GitHub's internal branch-based build (pages-build-deployment) races this
      # workflow on push and publishes raw source if it finishes last. Wait it out
      # so our artifact is always the final deployment.
      - name: Wait for in-flight branch Pages builds to finish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            pending=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/pages-build-deployment/runs?per_page=10" \
              --jq '[.workflow_runs[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
            if [ "${pending:-0}" = "0" ]; then
              echo "No Pages branch builds in flight."
              exit 0
            fi
            echo "Waiting on ${pending} pages-build-deployment run(s)… (${i}/40)"
            sleep 10
          done
          echo "Timed out waiting for branch builds; continuing."

      - name: Switch Pages build source to GitHub Actions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api -X PATCH "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
