services:
  portfolio:
    build:
      context: .
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-https://janagiram.dpdns.org}
    image: janagiram-portfolio:latest
    container_name: portfolio
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      - VITE_SITE_URL=${VITE_SITE_URL:-https://janagiram.dpdns.org}
    # Mount TLS material only if you terminate HTTPS in this container
    # (recommended: terminate TLS at a load balancer or use certbot on host).
    # volumes:
    #   - ./certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - portfolio-net

networks:
  portfolio-net:
    driver: bridge
